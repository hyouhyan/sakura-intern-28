name: Docker Build & Push

# main へのマージ/push を契機に backend のコンテナイメージをビルドし、
# さくらのコンテナレジストリへ push する。
on:
  push:
    branches:
      - main
      - feature/terraform-github-actions # TODO: 動作確認用、確認後に削除する
      - refactor/registry-in-bootstrap # TODO: 動作確認用の一時トリガー、確認後削除する
    paths:
      - "app/backend/**"
      - ".github/workflows/docker-build-push.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE_NAME: intern2026-app-backend

jobs:
  build-and-push:
    name: Build & Push backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # REGISTRY_SUBDOMAIN シークレットに前後の空白・改行が混じっていても
      # ホスト名として不正にならないよう、ここでトリムしてから使う。
      - name: Compute registry host
        env:
          REGISTRY_SUBDOMAIN: ${{ secrets.REGISTRY_SUBDOMAIN }}
        run: |
          subdomain="$(printf '%s' "$REGISTRY_SUBDOMAIN" | tr -d '[:space:]')"
          # 値が既に FQDN (xxx.sakuracr.jp) で渡された場合にも対応する
          subdomain="${subdomain%.sakuracr.jp}"
          echo "REGISTRY_HOST=${subdomain}.sakuracr.jp" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Sakura Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ci
          password: ${{ secrets.REGISTRY_CI_USER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
